name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # nx affected and changesets both need history, not just the tip
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # After build, because the budget is measured on the artifact and not on the source.
      - run: pnpm size

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The demo hosts serve the built SDK, so there is nothing to run against until this
      # has happened.
      - run: pnpm build

      - run: pnpm --filter @checkout-embed/e2e exec playwright install --with-deps chromium

      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # The report and the traces. Retries are on in CI, so a flake leaves a trace of
          # its second attempt behind.
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The deploy artifact, built and started. Fly should not be the first thing to find
      # out that the Dockerfile is wrong.
      - run: docker build -f apps/mock-psp/Dockerfile -t checkout-embed-psp:ci .

      - name: the container comes up and reaches its database
        run: |
          docker run -d --name psp -p 8080:8080 \
            -e WEBHOOK_SECRET=ci-secret-that-is-not-used-for-anything \
            -e DATABASE_URL=/tmp/psp.db \
            -e PUBLIC_BASE_URL=http://localhost:8080 \
            checkout-embed-psp:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 2
          done

          docker logs psp
          exit 1
