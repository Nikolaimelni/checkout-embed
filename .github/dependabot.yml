version: 2
updates:
  # The workflows pin actions to commit hashes. This is what moves the hashes forward.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Reads pnpm-lock.yaml. Grouped, so a week of patch releases is one pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/mock-psp
    schedule:
      interval: weekly
