<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your payment</title>
    <style>
      body {
        font: 15px/1.5 system-ui, sans-serif;
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f4f6f4;
        color: #141a17;
      }
      main {
        background: #fff;
        border: 1px solid #d9ddd8;
        padding: 24px 28px;
        max-width: 340px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 6px;
      }
      p {
        color: #48514c;
        margin: 0 0 16px;
      }
      button {
        font: inherit;
        padding: 9px 16px;
        border: 1px solid #0e6b57;
        background: #0e6b57;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Confirm your payment</h1>
      <p>Stands in for the bank's page. The real one comes from the mock provider.</p>
      <button type="button" id="approve">Approve</button>
    </main>
    <script>
      document.getElementById('approve').addEventListener('click', () => {
        parent.postMessage(
          { source: 'checkout-embed-3ds', intentId: 'pi_sandbox', approved: true },
          location.origin,
        );
        document.querySelector('main').innerHTML = '<h1>Approved</h1><p>Back to the shop.</p>';
      });
    </script>
  </body>
</html>
